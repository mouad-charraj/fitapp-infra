---
- name: Set timezone
  community.general.timezone:
    name: "{{ node_timezone }}"

- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - jq
      - fail2ban
      - unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Harden SSH (keys only, no root, fewer attempts)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-fitapp-hardening.conf
    mode: "0644"
    # AllowTcpForwarding stays at default (yes): the master is the jump host to the workers.
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Enable fail2ban (bans IPs brute-forcing SSH)
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Kernel settings for Kubernetes (many pods/log shippers need more inotify watchers)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-fitapp-k8s.conf
    reload: true
  loop:
    - { key: fs.inotify.max_user_instances, value: "8192" }
    - { key: fs.inotify.max_user_watches, value: "524288" }
    - { key: kernel.kptr_restrict, value: "2" }
    - { key: kernel.dmesg_restrict, value: "1" }

- name: Check if a reboot is required (kernel upgrade)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot if required
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: reboot_required.stat.exists
