---
- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s agent config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      # Managed by Ansible (roles/k3s_agent)
      node-ip: "{{ private_ip }}"
      flannel-iface: eth0
  register: agent_config

- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s agent {{ k3s_version }} and join the master
  ansible.builtin.command: /usr/local/bin/k3s-install.sh agent
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ master_private_ip }}:6443"
    K3S_TOKEN: "{{ hostvars[groups['master'][0]]['k3s_join_token'] }}"
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout
  changed_when: true
  no_log: true # environment contains the join token

- name: Restart agent if its config changed on an existing install
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: restarted
  when: agent_config.changed and k3s_installed.rc == 0

- name: Wait for this worker to be Ready (checked from the master)
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=30s
  delegate_to: "{{ groups['master'][0] }}"
  register: node_ready
  retries: 20
  delay: 10
  until: node_ready.rc == 0
  changed_when: false

- name: Label the node as a worker
  ansible.builtin.command: >
    k3s kubectl label node {{ inventory_hostname }}
    node-role.kubernetes.io/worker=worker --overwrite
  delegate_to: "{{ groups['master'][0] }}"
  register: label_result
  changed_when: "'labeled' in label_result.stdout"
