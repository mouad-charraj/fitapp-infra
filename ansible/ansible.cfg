[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
interpreter_python   = /usr/bin/python3
forks                = 10
timeout              = 30
callback_result_format = yaml
retry_files_enabled  = False

[ssh_connection]
# Separate known_hosts file: VMs are rebuilt for every demo (new host keys, maybe same IPs),
# scripts/up.sh and down.sh wipe it so we never get "REMOTE HOST IDENTIFICATION HAS CHANGED".
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=.known_hosts -o StrictHostKeyChecking=accept-new
pipelining = True
