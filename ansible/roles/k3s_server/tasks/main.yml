---
- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      # Managed by Ansible (roles/k3s_server)
      write-kubeconfig-mode: "0600"
      node-ip: "{{ private_ip }}"
      advertise-address: "{{ private_ip }}"
      flannel-iface: eth0
      tls-san:
        - "{{ master_public_ip }}"
        - "{{ private_ip }}"
      # Encrypt Kubernetes Secrets at rest in the datastore
      secrets-encryption: true
      {% if not (k3s_master_schedulable | bool) %}
      node-taint:
        - "node-role.kubernetes.io/control-plane:NoSchedule"
      {% endif %}
  notify: Restart k3s

- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s server {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh server
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout
  changed_when: true

- name: Apply pending config changes before continuing
  ansible.builtin.meta: flush_handlers

- name: Wait for the master node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=30s
  register: node_ready
  retries: 20
  delay: 10
  until: node_ready.rc == 0
  changed_when: false

- name: Read the cluster join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_file
  no_log: true

- name: Keep the token in memory for the workers (never written to the repo)
  ansible.builtin.set_fact:
    k3s_join_token: "{{ k3s_token_file.content | b64decode | trim }}"
  no_log: true
